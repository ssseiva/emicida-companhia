<style>
  /* ---------------------------------------------------------------
     Sistema visual herdado do deck "Emicida e companhia" (Seiva, 2026).
     Neue Haas Display + Editorial New, embutidas como woff2 no topo.
     O calendário tem tema próprio (claro/escuro) via tokens --cal-*.
     --------------------------------------------------------------- */
  :root {
    /* a pagina e escura; os headers sao as unicas faixas claras */
    --bg:       #0E0E0C;
    --bg-2:     #161613;
    --fg:       #F0F0E4;
    --fg-soft:  #A5A597;
    --line:     #33332B;
    --paper:    #FBFBF2;
    --paper-2:  #F1F1E6;

    --cream:    #FBFBF2;
    --cream-2:  #F4F4E8;
    --cream-3:  #EBEBDD;
    --ink:      #000000;
    --ink-soft: #4A4A40;
    --ink-fade: #7C7C6E;
    --yellow:   #F2F200;
    --magenta:  #FF1090;
    --lilac:    #F2A0FF;
    --chip:     #D6D6CE;

    /* color code — PRODUÇÃO: neutros quentes */
    --c-task:   #E2E2D2;
    --c-meet:   #C8C8B4;
    --c-rec:    #9E9E88;

    /* color code — MARKETING: família quente */
    --c-reel:   #FF1090;
    --c-carro:  #FFA3D8;
    --c-mail:   #F2F200;

    /* color code — INSCRITOS: família fria */
    --c-live:   #00D4BE;
    --c-nlet:   #5B9BFF;
    --c-zap:    #6FD4FF;
    --c-audio:  #B6A8FF;
    --c-video:  #5FE08A;
    --c-quote:  #B8EEE4;

    /* espelham o calendário escuro, para os chips que vivem fora dele (legenda) */
    --cal-bg:       #0F0F0D;
    --cal-ink:      #F0F0E4;
    --cal-marco-bg: #FBFBF2;
    --cal-marco-ink:#000000;

    --gutter: clamp(1rem, 2.5vw, 2.5rem);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Neue Haas Display", "Helvetica Neue", Arial, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- estrutura ---------- */

  .band { padding: clamp(2rem, 4vw, 3.5rem) var(--gutter); background: var(--bg); color: var(--fg); }
  .band--alt { background: var(--bg-2); }
  .band--wide { padding-inline: clamp(0.75rem, 1.5vw, 1.5rem); }

  .wrap { max-width: 1180px; margin: 0 auto; }
  .wrap--wide { max-width: 1640px; margin: 0 auto; }

  h2, h3 { font-weight: 900; letter-spacing: -0.022em; line-height: 0.98; text-wrap: balance; margin: 0; }
  h2 { font-size: clamp(2.25rem, 4.5vw, 3.25rem); }
  h3 { font-size: clamp(1.375rem, 2.2vw, 1.625rem); letter-spacing: -0.018em; line-height: 1.12; }

  .note { font-size: 1rem; line-height: 1.6; color: var(--fg-soft); max-width: 68ch; margin: 0; }
  .note strong { color: var(--fg); }

  .rule { border: 0; border-top: 6px solid var(--fg); margin: 0; }

  .pill {
    display: inline-block; border-radius: 999px; padding: 0.4em 1.05em;
    font-size: 0.9375rem; font-weight: 700; letter-spacing: -0.01em;
    background: var(--lilac); color: var(--ink);
  }
  .pill--yellow { background: var(--yellow); }
  .pill--ink { background: var(--fg); color: var(--bg); }

  .sechead {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 0.75rem 2rem; margin-bottom: 1.5rem;
  }

  /* ---------- barra corrente ---------- */

  .topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.7rem var(--gutter);
    background: var(--paper); color: var(--ink); border-bottom: 3px solid var(--bg);
    font-size: 0.875rem;
  }
  .topbar__year { background: var(--chip); border-radius: 999px; padding: 0.2rem 0.75rem; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- legenda ---------- */

  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.75rem 2.5rem; }
  .legend__col h3 {
    font-size: 0.875rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700;
    margin-bottom: 0.9rem; padding-bottom: 0.5rem; border-bottom: 4px solid var(--fg);
  }
  .legend__col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .legend__note { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 1rem 2.5rem; align-items: center; padding-top: 0.9rem; border-top: 1px solid var(--line); }
  .legend__note > div { display: flex; align-items: center; gap: 0.6rem; font-size: 0.875rem; color: var(--fg-soft); }

  /* ---------- filtros ---------- */

  .calzone { position: relative; }

  .controls {
    position: sticky; top: 44px; z-index: 30;
    background: var(--bg); color: var(--fg); border-block: 2px solid var(--line);
    padding: 0.9rem var(--gutter);
  }
  .controls__inner {
    max-width: 1640px; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1.5rem;
  }
  .controls__label { font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-soft); }
  .fgroup { display: flex; flex-wrap: wrap; gap: 0.5rem; }

  .filt {
    font: inherit; font-size: 0.9375rem; font-weight: 700; letter-spacing: -0.01em;
    border: 2px solid var(--fg); border-radius: 999px;
    padding: 0.4em 1.05em; cursor: pointer;
    background: var(--fg); color: var(--bg);
    display: inline-flex; align-items: center; gap: 0.5em;
  }
  .filt[aria-pressed="false"] { background: transparent; color: var(--fg); opacity: 0.45; }
  .filt:hover { opacity: 1; }
  .filt .dot { width: 0.8em; height: 0.8em; border-radius: 50%; flex: none; }
  .filt[data-f="prod"] .dot { background: var(--c-meet); }
  .filt[data-f="mkt"]  .dot { background: var(--c-reel); }
  .filt[data-f="insc"] .dot { background: var(--c-live); }
  .filt[aria-pressed="false"] .dot { background: transparent; border: 2px solid currentColor; }

  /* ---------- calendário: tokens de tema ---------- */

  .calscroll {
    --cal-bg:      #FFFFFF;
    --cal-bg2:     #F5F5F0;
    --cal-line:    #000000;
    --cal-ink:     #000000;
    --cal-ink-dim: #7C7C6E;
    --cal-band-bg: #000000;
    --cal-band-ink:#FBFBF2;
    --cal-marco-bg:#000000;
    --cal-marco-ink:#FBFBF2;

    overflow-x: auto;
    border: 3px solid var(--cal-line);
    background: var(--cal-line);
  }
  .calscroll[data-theme="dark"] {
    --cal-bg:      #0F0F0D;
    --cal-bg2:     #1D1D19;
    --cal-line:    #34342C;
    --cal-ink:     #F0F0E4;
    --cal-ink-dim: #8C8C7E;
    --cal-band-bg: #FBFBF2;
    --cal-band-ink:#000000;
    --cal-marco-bg:#FBFBF2;
    --cal-marco-ink:#000000;
  }

  .cal { min-width: 960px; display: flex; flex-direction: column; gap: 2px; }

  .cal__head { display: grid; grid-template-columns: 3.5rem repeat(7, minmax(0, 1fr)); gap: 2px; }
  .cal__head > div {
    background: var(--cal-bg2); color: var(--cal-ink);
    font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 0.5rem 0.75rem;
  }

  .monthband {
    background: var(--cal-band-bg); color: var(--cal-band-ink);
    padding: 0.75rem 1rem;
    font-size: 1.375rem; font-weight: 900; letter-spacing: -0.015em;
    display: flex; align-items: baseline; gap: 0.9rem;
  }
  .monthband span { font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.65; }

  .wk { display: grid; grid-template-columns: 3.5rem minmax(0, 1fr); gap: 2px; }
  .wk__label {
    background: var(--cal-bg2); padding: 0.7rem 0.4rem;
    font-size: 0.8125rem; font-weight: 600; line-height: 1.35;
    color: var(--cal-ink-dim); text-align: center; font-variant-numeric: tabular-nums;
  }
  .wk__label b { display: block; font-weight: 800; color: var(--cal-ink); }
  .wk__body { display: flex; flex-direction: column; gap: 2px; background: var(--cal-line); }
  .wk__bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; background: var(--cal-bg); }
  .wk__bars:empty { display: none; }
  .wk__days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; background: var(--cal-line); }

  .day { background: var(--cal-bg); color: var(--cal-ink); padding: 0.7rem 0.65rem 0.8rem; min-height: 13.5rem; }
  .day--today { background: var(--yellow); color: var(--ink); }
  .day__n {
    display: flex; align-items: baseline; gap: 0.4rem;
    font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 0.55rem;
  }
  .day__n .mo { font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .day__n .wd { display: none; }

  /* ---------- stickers ---------- */

  .ev {
    display: block; font-size: 0.875rem; line-height: 1.3; font-weight: 600;
    padding: 0.42rem 0.6rem; border-radius: 4px; margin-bottom: 0.35rem;
    background: var(--chip); color: var(--ink);
    border: 2px solid transparent; overflow-wrap: anywhere; cursor: help;
  }
  .ev:last-child { margin-bottom: 0; }
  .star {
    display: inline-block; width: 0.8em; height: 0.8em; flex: none;
    background: var(--yellow);
    filter: drop-shadow(0 0 0.6px rgba(0,0,0,0.75));
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .ev--emi::before {
    content: ""; display: inline-block; width: 0.85em; height: 0.85em;
    margin-right: 0.4em; vertical-align: -0.06em;
    background: var(--yellow);
    filter: drop-shadow(0 0 0.6px rgba(0,0,0,0.75));
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }

  .ev-task  { background: var(--c-task); }
  .ev-meet  { background: var(--c-meet); }
  .ev-rec   { background: var(--c-rec); }
  .ev-marco { background: var(--cal-marco-bg); color: var(--cal-marco-ink); font-weight: 800; }
  .ev-reel  { background: var(--c-reel); }
  .ev-carro { background: var(--c-carro); }
  .ev-mail  { background: var(--c-mail); }
  .ev-live  { background: var(--c-live); font-weight: 800; }
  .ev-nlet  { background: var(--c-nlet); }
  .ev-zap   { background: var(--c-zap); }
  .ev-audio { background: var(--c-audio); }
  .ev-video { background: var(--c-video); }
  .ev-quote { background: var(--c-quote); }

  /* ---------- tarefas contínuas: começo e fim explícitos ---------- */

  .bar {
    display: block; font-size: 0.875rem; line-height: 1.3; font-weight: 700;
    padding: 0.5rem 0.7rem; background: var(--c-task); color: var(--ink);

      desc: "a Seiva desenvolve, em diálogo com a Companhia, uma proposta de identidade e faz os ajustes de calendário acordados na reunião" },
    { s: "09-10", e: "09-16", t: "desenvolvimento do site e carrossel de anúncio", track: "prod",
      desc: "site de inscrição, formulário e o carrossel de anúncio, com ajustes até o dia 16" },
    { s: "09-18", e: "09-30", t: "edição dos reels e ajustes de automação, grupos etc", track: "prod",
      desc: "edição de tudo que foi gravado no dia 17, mais automações de WhatsApp, grupos e base de e-mail" },
    { s: "10-01", e: "10-31", t: "ads", track: "mkt", ads: 1,
      desc: "mídia paga no ar sem interrupção durante a campanha inteira, com troca de criativo no dia 15" }
  ];

  var MO_LONG = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var MO = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  var WD = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
  var PHASE = { 7: "antes do contrato", 8: "preparação", 9: "fases 1 e 2 · anúncio e escolha", 10: "fase 3 · a leitura", 11: "pós" };
  var YEAR = 2026, TODAY = "08-25", DAY = 86400000;

  function toDate(md) { return new Date(YEAR, parseInt(md.slice(0, 2), 10) - 1, parseInt(md.slice(3), 10)); }
  function key(dt) {
    var m = dt.getMonth() + 1, d = dt.getDate();
    return (m < 10 ? "0" : "") + m + "-" + (d < 10 ? "0" : "") + d;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function fmt(dt) { return dt.getDate() + " " + MO[dt.getMonth()]; }
  function trackOf(e) { return KINDS[e.k].track; }
  function tipAttrs(kind, title, desc, items) {
    return ' data-kind="' + esc(kind) + '" data-title="' + esc(title) +
           '" data-desc="' + esc(desc || "") +
           '" data-items="' + esc((items || []).join("|")) + '" tabindex="0"';
  }

  var byDay = {};
  EV.forEach(function (e) { (byDay[e.d] = byDay[e.d] || []).push(e); });
  PERIODS.forEach(function (pd) { pd._s = toDate(pd.s); pd._e = toDate(pd.e); });

  /* ---- grade: 16/08 (domingo) → 19/12 (sábado) ---- */
  var cal = document.getElementById("cal");
  var cursor = new Date(YEAR, 7, 16);
  var END = new Date(YEAR, 11, 5);
  var weekNo = 32, lastMonth = -1, monthShown = -1;
  var html = "";

  var HEAD = (function () {
    var h = '<div class="cal__head"><div></div>';
    WD.forEach(function (w) { h += "<div>" + w + "</div>"; });
    return h + "</div>";
  })();

  while (cursor <= END) {
    var weekStart = new Date(cursor);
    var weekEnd = new Date(cursor);
    weekEnd.setDate(weekEnd.getDate() + 6);

    for (var m = 0; m < 7; m++) {
      var probe = new Date(weekStart);
      probe.setDate(probe.getDate() + m);
      if ((probe.getDate() === 1 || monthShown === -1) && probe.getMonth() !== monthShown) {
        monthShown = probe.getMonth();
        html += '<div class="monthband">' + MO_LONG[monthShown] +
                "<span>" + (PHASE[monthShown] || "") + "</span></div>" + HEAD;
        break;
      }
    }

    html += '<div class="wk"><div class="wk__label"><b>W' + weekNo + "</b>" +
            weekStart.getDate() + "–" + weekEnd.getDate() + '</div><div class="wk__body">';

    /* --- tarefas contínuas: recorta o trecho da semana e marca as pontas --- */
    var bars = "";
    PERIODS.forEach(function (pd) {
      if (pd._e < weekStart || pd._s > weekEnd) return;
      var segS = pd._s > weekStart ? pd._s : weekStart;
      var segE = pd._e < weekEnd ? pd._e : weekEnd;
      var col = segS.getDay() + 1;
      var span = Math.round((segE - segS) / DAY) + 1;
      var isStart = pd._s >= weekStart;
      var isEnd = pd._e <= weekEnd;
      var total = Math.round((pd._e - pd._s) / DAY) + 1;

      var label = isStart ? esc(pd.t) : '<span class="bar__cont">' + esc(pd.t) + "</span>";
      var cls = "bar" + (pd.ads ? " bar-ads" : "") +
                (isStart ? " bar--start" : " bar--contL") +
                (isEnd ? " bar--end" : " bar--contR");

      bars += '<div class="' + cls + '" data-track="' + pd.track + '" data-emi="0" style="grid-column:' +
              col + "/" + (col + span) + '"' +
              tipAttrs("tarefa contínua · " + total + (total === 1 ? " dia" : " dias"),
                       pd.t + " · " + fmt(pd._s) + " a " + fmt(pd._e), pd.desc) +
              ">" + label + "</div>";
    });
    html += '<div class="wk__bars">' + bars + "</div>";

    /* --- dias --- */
    html += '<div class="wk__days">';
    for (var j = 0; j < 7; j++) {
      var day = new Date(weekStart);
      day.setDate(day.getDate() + j);
      var kk = key(day);
      var evs = byDay[kk] || [];
      var cls2 = "day";
      if (kk === TODAY) cls2 += " day--today";
      else if (!evs.length) cls2 += " day--empty";

      html += '<div class="' + cls2 + '"><div class="day__n"><span>' + day.getDate() + "</span>";
      if (day.getMonth() !== lastMonth) {
        html += '<span class="mo">' + MO[day.getMonth()] + "</span>";
        lastMonth = day.getMonth();
      }
      html += '<span class="wd">' + WD[day.getDay()] + "</span></div>";

      evs.forEach(function (e) {
        var kd = KINDS[e.k];
        html += '<span class="ev ' + kd.cls + (e.emi ? " ev--emi" : "") +
                '" data-track="' + kd.track + '" data-emi="' + (e.emi ? 1 : 0) + '"' +
                tipAttrs(kd.label + " · " + day.getDate() + " " + MO[day.getMonth()],
                         e.long || e.t, e.desc, e.items) +
                ">" + esc(e.t) + "</span>";
      });
      html += "</div>";
    }
    html += "</div></div></div>";

    cursor.setDate(cursor.getDate() + 7);
    weekNo++;
  }
  cal.innerHTML = html;

  /* ---- legenda ---- */
  var lh = "";
  Object.keys(TRACKS).forEach(function (tr) {
    lh += '<div class="legend__col"><h3>' + TRACKS[tr] + "</h3><ul>";
    Object.keys(KINDS).forEach(function (k) {
      if (KINDS[k].track !== tr) return;
      lh += '<li><span class="ev ' + KINDS[k].cls + '" style="margin:0">' + KINDS[k].label + "</span></li>";
    });
    lh += "</ul></div>";
  });
  lh += '<div class="legend__note">' +
        '<div><span class="star"></span><span>a estrela marca o que depende do Emicida</span></div>' +
        '<div><strong style="color:var(--fg)">Passe o mouse</strong><span>em qualquer item para ver o detalhe</span></div>' +
        "</div>";
  document.getElementById("legend").innerHTML = lh;

  /* ---- tooltip ---- */
  var tip = document.getElementById("tip");
  var tKind = tip.querySelector(".tip__kind"),
      tTitle = tip.querySelector(".tip__title"),
      tDesc = tip.querySelector(".tip__desc"),
      tItems = tip.querySelector(".tip__items");

  function showTip(el) {
    tKind.textContent = el.getAttribute("data-kind") || "";
    tTitle.textContent = el.getAttribute("data-title") || "";
    tDesc.textContent = el.getAttribute("data-desc") || "";
    var items = (el.getAttribute("data-items") || "").split("|").filter(Boolean);
    tItems.innerHTML = items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("");
    tip.hidden = false;

    var r = el.getBoundingClientRect();
    var tr = tip.getBoundingClientRect();
    var left = r.left + r.width / 2 - tr.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
    var top = r.top - tr.height - 10;
    if (top < 8) top = Math.min(r.bottom + 10, window.innerHeight - tr.height - 8);
    tip.style.left = left + "px";
    tip.style.top = Math.max(8, top) + "px";
  }
  function hideTip() { tip.hidden = true; }

  cal.addEventListener("mouseover", function (ev) {
    var el = ev.target.closest("[data-kind]");
    if (el) showTip(el);
  });
  cal.addEventListener("mouseout", function (ev) {
    if (ev.target.closest("[data-kind]")) hideTip();
  });
  cal.addEventListener("focusin", function (ev) {
    var el = ev.target.closest("[data-kind]");
    if (el) showTip(el);
  });
  cal.addEventListener("focusout", hideTip);
  window.addEventListener("scroll", hideTip, true);
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") hideTip(); });

  /* ---- filtros ---- */
  var state = { prod: true, mkt: true, insc: true };

  function apply() {
    cal.setAttribute("data-off-prod", state.prod ? "0" : "1");
    cal.setAttribute("data-off-mkt",  state.mkt  ? "0" : "1");
    cal.setAttribute("data-off-insc", state.insc ? "0" : "1");
    hideTip();
  }

  Array.prototype.forEach.call(document.querySelectorAll(".filt[data-f]"), function (btn) {
    btn.addEventListener("click", function () {
      var f = btn.getAttribute("data-f");
      state[f] = !state[f];
      btn.setAttribute("aria-pressed", state[f] ? "true" : "false");
      apply();
    });
  });
  apply();

  /* ---- inventário: uma tabela só, agrupada por trilha ---- */
  function total(pred) { return EV.filter(pred).length; }

  var invBody = "";
  Object.keys(TRACKS).forEach(function (tr) {
    invBody += '<tr class="grouprow"><td colspan="2">' + TRACKS[tr] + "</td></tr>";
    Object.keys(KINDS).forEach(function (k) {
      if (KINDS[k].track !== tr) return;
      var n = total(function (e) { return e.k === k; });
      if (!n) return;
      var sw = KINDS[k].v
        ? '<span class="swatch" style="background:var(--c-' + KINDS[k].v + ')"></span>'
        : '<span class="swatch swatch--marco"></span>';
      invBody += "<tr><td>" + sw + KINDS[k].label + '</td><td class="num">' + n + "</td></tr>";
    });
    invBody += '<tr class="subrow"><td>subtotal</td><td class="num">' +
               total(function (e) { return trackOf(e) === tr; }) + "</td></tr>";
  });

  document.getElementById("inv").innerHTML =
    "<caption>Todos os itens do calendário, por tipo</caption>" +
    '<thead><tr><th>Tipo</th><th class="num">total</th></tr></thead><tbody>' + invBody + "</tbody>" +
    '<tfoot><tr><td>peças publicadas</td><td class="num">' +
    total(function (e) { return trackOf(e) !== "prod"; }) + "</td></tr></tfoot>";

})();
</script>

</body>
</html>
